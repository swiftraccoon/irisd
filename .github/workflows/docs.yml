name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job names the permissions it needs; only the deploy job may write Pages or mint an OIDC token.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GTK and GStreamer development libraries (iris-gui)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build rustdoc (warnings are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: Add a landing page that opens the daemon's documentation
        run: printf '<!doctype html><meta http-equiv="refresh" content="0; url=irisd/index.html"><a href="irisd/index.html">irisd documentation</a>\n' > target/doc/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
