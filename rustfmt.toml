# Formatting follows the Rust Style Guide (docs/standards/rust-style-guide/) as implemented
# by rustfmt, plus the stable options the Google Rust style guide recommends.
style_edition = "2024"
max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
# Unstable options we would enable on a nightly rustfmt (see STANDARDS.md §2):
# imports_granularity = "Module"
# hex_literal_case = "Lower"
# format_macro_matchers = true
