[package]
name = "iris-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/swiftraccoon/irisd"
description = "cargo-fuzz targets for irisd's network-facing parsers"

[package.metadata]
cargo-fuzz = true

[dependencies]
anyhow = "1"
iris-core = { path = "../crates/iris-core" }
iris-events = { path = "../crates/iris-events", features = ["fuzzing"] }
iris-h265 = { path = "../crates/iris-h265" }
iris-mp4 = { path = "../crates/iris-mp4" }
iris-replay = { path = "../crates/iris-replay" }
libfuzzer-sys = "0.4"
log = "0.4"
oxvif = "0.17"
retina = { version = "0.4.21", features = ["h265"] }
serde_json = "1"
url = "2"

[patch.crates-io]
oxvif = { path = "../third_party/oxvif" }
retina = { path = "../third_party/retina" }

# The workspace's lint tables, repeated because this crate is not a member.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
pedantic = { level = "warn", priority = -1 }
struct_excessive_bools = "allow"

[[bin]]
bench = false
doc = false
name = "api_time"
path = "fuzz_targets/api_time.rs"
test = false

