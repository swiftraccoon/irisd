[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/iris-core",
    "crates/iris-h265",
    "crates/iris-mp4",
    "crates/iris-ingest",
    "crates/iris-store",
    "crates/iris-catalog",
    "crates/iris-events",
    "crates/iris-api",
    "crates/irisd",
    "crates/iris-replay",
    "crates/iris-gui",
    "crates/iris-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
iris-core = { path = "crates/iris-core" }
iris-h265 = { path = "crates/iris-h265" }
iris-mp4 = { path = "crates/iris-mp4" }
iris-ingest = { path = "crates/iris-ingest" }
iris-store = { path = "crates/iris-store" }
iris-catalog = { path = "crates/iris-catalog" }
iris-events = { path = "crates/iris-events" }
iris-api = { path = "crates/iris-api" }
iris-replay = { path = "crates/iris-replay" }

anyhow = "1"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
crc32c = "0.6"
crc-fast = { version = "1.10", default-features = false, features = ["std"] }
futures = "0.3"
retina = { version = "0.4.21", features = ["h265"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.54", features = ["rt", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
axum = { version = "0.8", features = ["ws", "json", "query", "http2"] }
tower-http = { version = "0.7", features = ["fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
humantime = "2"
humantime-serde = "1"
mime_guess = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
md-5 = "0.11"
hex = "0.4"
serde_json = "1"
tokio-tungstenite = "0.30"
async-channel = "2"
sd-notify = "0.5"
landlock = "0.4"
tokio-stream = "0.1"
http-body-util = "0.1"
tower = "0.5"
futures-util = "0.3"
oxvif = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the API guidelines or this codebase's conventions.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.bench]
inherits = "release"
debug = true
strip = false

[patch.crates-io]
# retina 0.4.21 plus PlayOptions::recv_low_water (third_party/README.md).
retina = { path = "third_party/retina" }
