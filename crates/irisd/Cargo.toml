[package]
name = "irisd"
description = "irisd: an H.265 network video recorder whose record path never decodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "irisd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
humantime = { workspace = true }
rustix = { workspace = true, features = ["param", "process"] }
iris-core = { workspace = true }
iris-h265 = { workspace = true }
iris-mp4 = { workspace = true }
iris-ingest = { workspace = true }
iris-store = { workspace = true }
iris-catalog = { workspace = true }
iris-events = { workspace = true }
iris-api = { workspace = true }
sd-notify = { workspace = true }
landlock = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
