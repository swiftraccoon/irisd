[package]
name = "irisd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "An H.265 network video recorder whose record path never decodes video"

[[bin]]
name = "irisd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
getrandom = { workspace = true }
humantime = { workspace = true }
iris-api = { workspace = true }
iris-catalog = { workspace = true }
iris-core = { workspace = true }
iris-events = { workspace = true }
iris-ingest = { workspace = true }
iris-mp4 = { workspace = true }
iris-store = { workspace = true }
landlock = { workspace = true }
rustix = { workspace = true, features = ["param", "process"] }
sd-notify = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
iris-catalog = { workspace = true, features = ["test-support"] }
iris-replay = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
