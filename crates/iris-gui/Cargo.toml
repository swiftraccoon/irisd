[package]
name = "iris-gui"
description = "A GTK 4 viewer for irisd: live tiles decoded by GStreamer from the daemon's WebSocket feed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "iris-gui"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-channel = { workspace = true }
axum = { workspace = true }
clap = { workspace = true, features = ["env"] }
futures = { workspace = true }
getrandom = "0.4"
gst = { package = "gstreamer", version = "0.25" }
gst_app = { package = "gstreamer-app", version = "0.25" }
gst_video = { package = "gstreamer-video", version = "0.25" }
gstgtk4 = { package = "gst-plugin-gtk4", version = "0.15", features = ["wayland", "x11egl", "x11glx", "dmabuf", "gtk_v4_14"] }
gtk = { package = "gtk4", version = "0.11" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
